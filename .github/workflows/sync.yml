name: Sync Sileo Repo

on:
  workflow_run:
    workflows: ["Build iOS Tweak"]
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev gzip bzip2

      - name: Download debs from release
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          rm -rf debs
          mkdir -p debs
          RUN_ID=$(gh api "repos/dung-x/Wifi-bruter/actions/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          for variant in rootful rootless roothide; do
            ARTIFACT_ID=$(gh api "repos/dung-x/Wifi-bruter/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"wifibruter-deb-$variant\") | .id")
            if [ -n "$ARTIFACT_ID" ]; then
              gh api -H "Accept: application/vnd.github+json" \
                "repos/dung-x/Wifi-bruter/actions/artifacts/$ARTIFACT_ID/zip" \
                > artifact-$variant.zip
              unzip -o artifact-$variant.zip -d debs_tmp/
              mv debs_tmp/*.deb debs/ 2>/dev/null || true
              rm -rf debs_tmp artifact-$variant.zip
            fi
          done
          ls -la debs/

      - name: Generate Packages index
        run: |
          chmod +x generate-packages.sh
          ./generate-packages.sh

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Sync packages from latest build" || echo "No changes to commit"
          git push
