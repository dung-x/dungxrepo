name: Sync Sileo Repo

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev gzip bzip2

      - name: Download deb from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R dung-x/Wifi-bruter --pattern '*.deb' --dir debs

      - name: Generate Packages index
        run: |
          chmod +x generate-packages.sh
          ./generate-packages.sh

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Packages Packages.gz Packages.bz2 Release debs/
          git commit -m "Sync packages from latest release" || echo "No changes to commit"
          git push
