name: Sync Sileo Repo

on:
  workflow_run:
    workflows: ["Build iOS Tweak (Rootful, Rootless, Roothide)"]
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev gzip bzip2

      - name: Get build artifacts from main repo
        id: get_artifacts
        run: |
          RUN_ID=$(gh api "repos/dung-x/Wifi-bruter/actions/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          mkdir -p debs
          for variant in rootful rootless roothide; do
            ARTIFACT_ID=$(gh api "repos/dung-x/Wifi-bruter/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"wifibruter-deb-$variant\") | .id")
            if [ -n "$ARTIFACT_ID" ]; then
              gh api -H "Accept: application/vnd.github+json" \
                "repos/dung-x/Wifi-bruter/actions/artifacts/$ARTIFACT_ID/zip" \
                -o "artifact-$variant.zip"
              unzip -o "artifact-$variant.zip" -d "debs/$variant"
              rm -f "artifact-$variant.zip"
            fi
          done

      - name: Flatten debs into debs/
        run: |
          for variant in rootful rootless roothide; do
            if [ -d "debs/$variant" ]; then
              find "debs/$variant" -name "*.deb" -exec mv {} debs/ \;
              rmdir "debs/$variant" 2>/dev/null || true
            fi
          done

      - name: Generate Packages index
        run: |
          chmod +x generate-packages.sh
          ./generate-packages.sh

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Packages Packages.gz Packages.bz2 Release debs/
          git commit -m "Sync packages from latest build (run ${{ steps.get_artifacts.outputs.run_id }})" || echo "No changes to commit"
          git push
